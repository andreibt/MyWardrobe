<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Add Item — PolarNest Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f7fa;
      --fg: #0d1117;
      --accent: #161b22;
      --surface: #eceef1;
      --muted: #8d9094;
      --border: #d5d7da;
      --radius: 8px;
      --radius-lg: 14px;
      --font: 'Inter', system-ui, -apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif;
      --tab-bar: rgba(245,247,250,0.96);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100vh;
      background: var(--bg);
      font: 400 15px/1.5 var(--font);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .phone {
      max-width: 390px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--fg);
      flex-shrink: 0;
    }
    .status-bar .time { font-weight: 700; }
    .status-icons { display: flex; gap: 6px; align-items: center; font-size: 11px; }
    .nav-bar {
      display: flex;
      align-items: center;
      padding: 4px 20px 12px;
      gap: 8px;
      flex-shrink: 0;
    }
    .nav-bar .back-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
      color: var(--fg);
      text-decoration: none;
      transition: background 0.15s;
    }
    .nav-bar .back-btn:hover { background: var(--surface); }
    .nav-bar h1 {
      flex: 1;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 100px;
    }

    /* ---- module toggle ---- */
    .module-toggle {
      display: flex;
      background: var(--surface);
      border-radius: 999px;
      padding: 3px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .module-toggle button {
      flex: 1;
      padding: 10px 16px;
      border-radius: 999px;
      border: 0;
      background: transparent;
      font: 500 14px var(--font);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .module-toggle button.active {
      background: var(--accent);
      color: var(--bg);
    }
    .module-toggle button:hover:not(.active) { color: var(--fg); }

    /* ---- photo upload ---- */
    .photo-upload {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: var(--radius-lg);
      border: 2px dashed var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-bottom: 24px;
      transition: border-color 0.15s;
    }
    .photo-upload:hover { border-color: var(--muted); }
    .photo-upload .upload-icon {
      font-size: 32px;
      color: var(--muted);
    }
    .photo-upload .upload-label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }
    .photo-upload .upload-hint {
      font-size: 11px;
      color: var(--muted);
    }

    /* ---- form ---- */
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      font: 400 15px var(--font);
      color: var(--fg);
      outline: none;
      transition: border-color 0.15s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
    }
    .form-group input::placeholder,
    .form-group textarea::placeholder { color: var(--muted); }
    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    /* ---- inline row ---- */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* ---- submit ---- */
    .submit-btn {
      width: 100%;
      padding: 16px;
      border-radius: var(--radius);
      border: 0;
      background: var(--accent);
      color: var(--bg);
      font: 600 16px var(--font);
      cursor: pointer;
      transition: opacity 0.15s;
      margin-bottom: 12px;
    }
    .submit-btn:hover { opacity: 0.9; }
    .cancel-btn {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font: 500 14px var(--font);
      cursor: pointer;
      transition: background 0.15s;
    }
    .cancel-btn:hover { background: var(--surface); }

    /* ---- tab bar ---- */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 390px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 0 max(env(safe-area-inset-bottom, 8px), 8px);
      background: var(--tab-bar);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      text-decoration: none;
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 4px 12px;
      background: none;
      border: 0;
      cursor: pointer;
      font-family: var(--font);
      transition: color 0.15s;
    }
    .tab-item .tab-icon { font-size: 20px; line-height: 1; }
    .tab-item.active { color: var(--accent); }
  </style>
</head>
<body>
  <div class="phone">

    <div class="status-bar">
      <span class="time">9:41</span>
      <span class="status-icons">&#9679;&#9679;&#9679;</span>
    </div>

    <div class="nav-bar">
      <a class="back-btn" href="home.html" aria-label="Back">&#8592;</a>
      <h1>Add item</h1>
    </div>

    <div class="content">

      <!-- module toggle -->
      <div class="module-toggle" role="tablist">
        <button class="active" data-module="wardrobe" role="tab">&#9825; Wardrobe</button>
        <button data-module="fridge" role="tab">&#9733; Fridge</button>
      </div>

      <!-- photo area -->
      <div class="photo-upload" id="photoZone">
        <div class="upload-icon">&#128247;</div>
        <div class="upload-label">Add photo</div>
        <div class="upload-hint">Tap to capture or choose from gallery</div>
      </div>

      <!-- form -->
      <form id="itemForm" onsubmit="return false;">

        <!-- wardrobe fields -->
        <div id="wardrobeFields">
          <div class="form-group">
            <label for="itemName">Item name</label>
            <input type="text" id="itemName" placeholder="e.g. Cashmere Sweater" />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="brand">Brand</label>
              <input type="text" id="brand" placeholder="e.g. Nordstrom" />
            </div>
            <div class="form-group">
              <label for="color">Color</label>
              <input type="text" id="color" placeholder="e.g. Navy" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="size">Size</label>
              <select id="size">
                <option value="">Select size</option>
                <option>XS</option>
                <option>S</option>
                <option>M</option>
                <option>L</option>
                <option>XL</option>
                <option>XXL</option>
              </select>
            </div>
            <div class="form-group">
              <label for="category">Category</label>
              <select id="category">
                <option value="">Select</option>
                <option>Tops</option>
                <option>Bottoms</option>
                <option>Outerwear</option>
                <option>Footwear</option>
                <option>Accessories</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="material">Material</label>
            <input type="text" id="material" placeholder="e.g. 100% Cashmere" />
          </div>
        </div>

        <!-- fridge fields -->
        <div id="fridgeFields" style="display:none;">
          <div class="form-group">
            <label for="foodName">Item name</label>
            <input type="text" id="foodName" placeholder="e.g. Greek Yogurt" />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="quantity">Quantity</label>
              <input type="text" id="quantity" placeholder="e.g. 500g, 2 units" />
            </div>
            <div class="form-group">
              <label for="foodCat">Category</label>
              <select id="foodCat">
                <option value="">Select</option>
                <option>Produce</option>
                <option>Dairy</option>
                <option>Meat</option>
                <option>Pantry</option>
                <option>Frozen</option>
                <option>Beverages</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="purchaseDate">Purchase date</label>
              <input type="date" id="purchaseDate" />
            </div>
            <div class="form-group">
              <label for="expiryDate">Expiry date</label>
              <input type="date" id="expiryDate" />
            </div>
          </div>
        </div>

        <!-- shared notes -->
        <div class="form-group">
          <label for="notes">Notes</label>
          <textarea id="notes" placeholder="Any additional details..."></textarea>
        </div>

        <!-- actions -->
        <button class="submit-btn" type="button">Save item</button>
        <button class="cancel-btn" type="button" onclick="history.back()">Cancel</button>

      </form>

    </div>

    <nav class="tab-bar">
      <a class="tab-item" href="home.html">
        <span class="tab-icon">&#9650;</span>
        <span>Home</span>
      </a>
      <a class="tab-item" href="wardrobe.html">
        <span class="tab-icon">&#9825;</span>
        <span>Wardrobe</span>
      </a>
      <a class="tab-item" href="../../fridge.html">
        <span class="tab-icon">&#9733;</span>
        <span>Fridge</span>
      </a>
      <a class="tab-item" href="#">
        <span class="tab-icon">&#8981;</span>
        <span>Search</span>
      </a>
      <a class="tab-item" href="#">
        <span class="tab-icon">&#9881;</span>
        <span>Settings</span>
      </a>
    </nav>

  </div>
  <script>
    (function() {
      var wardrobeBtn = document.querySelector('[data-module="wardrobe"]');
      var fridgeBtn = document.querySelector('[data-module="fridge"]');
      var wardrobeFields = document.getElementById('wardrobeFields');
      var fridgeFields = document.getElementById('fridgeFields');

      function showWardrobe() {
        wardrobeBtn.classList.add('active');
        fridgeBtn.classList.remove('active');
        wardrobeFields.style.display = '';
        fridgeFields.style.display = 'none';
      }
      function showFridge() {
        fridgeBtn.classList.add('active');
        wardrobeBtn.classList.remove('active');
        fridgeFields.style.display = '';
        wardrobeFields.style.display = 'none';
      }

      wardrobeBtn.addEventListener('click', showWardrobe);
      fridgeBtn.addEventListener('click', showFridge);

      document.querySelector('.submit-btn').addEventListener('click', function() {
        this.textContent = 'Saved!';
        var self = this;
        setTimeout(function() { self.textContent = 'Save item'; }, 2000);
      });
    })();
  </script>
</body>
</html>
