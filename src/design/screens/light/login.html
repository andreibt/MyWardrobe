<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Log In — PolarNest Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f7fa;
      --fg: #0d1117;
      --accent: #161b22;
      --surface: #eceef1;
      --muted: #8d9094;
      --border: #d5d7da;
      --radius: 8px;
      --radius-lg: 14px;
      --font: 'Inter', system-ui, -apple-system, Segoe UI, Helvetica Neue, Arial, sans-serif;
      --tab-bar: rgba(245,247,250,0.96);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100vh;
      background: var(--bg);
      font: 400 15px/1.5 var(--font);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .phone {
      max-width: 390px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--fg);
      flex-shrink: 0;
    }
    .status-bar .time { font-weight: 700; }
    .status-icons { display: flex; gap: 6px; align-items: center; font-size: 11px; }
    .nav-bar {
      display: flex;
      align-items: center;
      padding: 4px 20px 12px;
      gap: 8px;
      flex-shrink: 0;
    }
    .nav-bar .back-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
      color: var(--fg);
      text-decoration: none;
      transition: background 0.15s;
    }
    .nav-bar .back-btn:hover { background: var(--surface); }
    .nav-bar h1 {
      flex: 1;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 100px;
      display: flex;
      flex-direction: column;
    }

    /* ---- brand ---- */
    .brand-area {
      text-align: center;
      padding: 32px 0 24px;
    }
    .brand-area .app-icon {
      width: 56px; height: 56px;
      background: var(--accent);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--bg);
      font-weight: 700;
      font-size: 26px;
      margin: 0 auto 16px;
    }
    .brand-area h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand-area p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ---- form ---- */
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      font: 400 15px var(--font);
      color: var(--fg);
      outline: none;
      transition: border-color 0.15s;
    }
    .form-group input:focus {
      border-color: var(--accent);
    }
    .form-group input::placeholder { color: var(--muted); }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .form-options label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
    }
    .form-options label input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: var(--accent);
    }
    .form-options a {
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .login-btn {
      width: 100%;
      padding: 16px;
      border-radius: var(--radius);
      border: 0;
      background: var(--accent);
      color: var(--bg);
      font: 600 16px var(--font);
      cursor: pointer;
      transition: opacity 0.15s;
      margin-bottom: 12px;
    }
    .login-btn:hover { opacity: 0.9; }

    /* ---- divider ---- */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .divider span {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ---- social ---- */
    .social-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: transparent;
      font: 500 13px var(--font);
      color: var(--fg);
      cursor: pointer;
      transition: background 0.15s;
    }
    .social-btn:hover { background: var(--surface); }
    .social-btn .social-icon {
      font-size: 18px;
      line-height: 1;
    }

    /* ---- signup link ---- */
    .signup-area {
      text-align: center;
      margin-top: 28px;
      font-size: 13px;
      color: var(--muted);
    }
    .signup-area a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    /* ---- tab bar ---- */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 390px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 0 max(env(safe-area-inset-bottom, 8px), 8px);
      background: var(--tab-bar);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      text-decoration: none;
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 4px 12px;
      background: none;
      border: 0;
      cursor: pointer;
      font-family: var(--font);
      transition: color 0.15s;
    }
    .tab-item .tab-icon { font-size: 20px; line-height: 1; }
    .tab-item.active { color: var(--accent); }
  </style>
</head>
<body>
  <div class="phone">

    <div class="status-bar">
      <span class="time">9:41</span>
      <span class="status-icons">&#9679;&#9679;&#9679;</span>
    </div>

    <div class="nav-bar">
      <a class="back-btn" href="../../index.html" aria-label="Back">&#8592;</a>
      <h1>Account</h1>
    </div>

    <div class="content">

      <div class="brand-area">
        <div class="app-icon">P</div>
        <h2>Welcome back</h2>
        <p>Sign in to manage your inventory</p>
      </div>

      <form id="loginForm" onsubmit="return false;">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
        </div>

        <div class="form-options">
          <label>
            <input type="checkbox" checked /> Remember me
          </label>
          <a href="#">Forgot password?</a>
        </div>

        <button class="login-btn" type="button" id="loginBtn">Log in</button>
      </form>

      <div class="divider">
        <span>Or continue with</span>
      </div>

      <div class="social-row">
        <button class="social-btn" type="button">
          <span class="social-icon">&#9679;</span>
          Google
        </button>
        <button class="social-btn" type="button">
          <span class="social-icon">&#9679;</span>
          Apple
        </button>
      </div>

      <div class="signup-area">
        Don't have an account? <a href="#">Sign up</a>
      </div>

    </div>

    <nav class="tab-bar">
      <a class="tab-item" href="home.html">
        <span class="tab-icon">&#9650;</span>
        <span>Home</span>
      </a>
      <a class="tab-item" href="wardrobe.html">
        <span class="tab-icon">&#9825;</span>
        <span>Wardrobe</span>
      </a>
      <a class="tab-item" href="../../fridge.html">
        <span class="tab-icon">&#9733;</span>
        <span>Fridge</span>
      </a>
      <a class="tab-item" href="#">
        <span class="tab-icon">&#8981;</span>
        <span>Search</span>
      </a>
      <a class="tab-item active" href="login.html">
        <span class="tab-icon">&#9881;</span>
        <span>Account</span>
      </a>
    </nav>

  </div>
  <script>
    document.getElementById('loginBtn').addEventListener('click', function() {
      var self = this;
      self.textContent = 'Logging in...';
      self.style.opacity = '0.7';
      setTimeout(function() {
        self.textContent = 'Logged in';
        self.style.opacity = '1';
        setTimeout(function() { self.textContent = 'Log in'; }, 2000);
      }, 1200);
    });
  </script>
</body>
</html>
