<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Log In — PolarNest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#08090e; --s1:#111318; --s2:#1a1d23; --s3:#242830; --primary:#00d4ff; --pdim:rgba(0,212,255,0.15); --secondary:#00e676; --text:#f0f2f5; --text2:#8b8fa3; --muted:#5a5e6e; --border:#2a2e38; --radius:10px; --radius-lg:16px; --font:'Inter',system-ui,-apple-system,sans-serif; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { width:100%; min-height:100vh; background:var(--bg); font:400 15px/1.6 var(--font); color:var(--text); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
    .phone { max-width:390px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); position:relative; }
    .status-bar { display:flex; justify-content:space-between; padding:12px 20px 8px; font-size:12px; font-weight:600; flex-shrink:0; }
    .back-btn { width:36px; height:36px; border-radius:50%; border:1px solid var(--border); background:transparent; font-size:18px; cursor:pointer; display:grid; place-items:center; color:var(--text); text-decoration:none; margin:4px 20px 0; }
    .content { flex:1; overflow-y:auto; padding:0 20px 100px; display:flex; flex-direction:column; }
    .brand-area { text-align:center; padding:24px 0 28px; }
    .brand-area .icon { width:56px;height:56px; background:linear-gradient(135deg,var(--primary),var(--secondary)); border-radius:14px; display:flex; align-items:center; justify-content:center; color:#08090e; font-weight:700; font-size:24px; margin:0 auto 16px; }
    .brand-area h2 { font-size:26px; font-weight:700; letter-spacing:-0.02em; }
    .brand-area p { font-size:14px; color:var(--text2); margin-top:4px; }
    .form-group { margin-bottom:16px; }
    .form-group label { display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--text2); margin-bottom:6px; }
    .form-group input { width:100%; padding:14px 16px; border:1px solid var(--border); border-radius:var(--radius); background:var(--s1); font:400 15px var(--font); color:var(--text); outline:none; transition:border-color 0.15s; }
    .form-group input:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--pdim); }
    .form-group input::placeholder { color:var(--muted); }
    .form-options { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; font-size:13px; }
    .form-options label { display:flex; align-items:center; gap:8px; color:var(--text2); cursor:pointer; }
    .form-options input[type="checkbox"] { width:16px;height:16px; accent-color:var(--primary); }
    .form-options a { color:var(--primary); text-decoration:none; font-weight:500; }
    .login-btn { width:100%; padding:16px; border-radius:var(--radius); border:0; background:var(--primary); color:#08090e; font:600 16px var(--font); cursor:pointer; transition:opacity 0.15s; margin-bottom:16px; }
    .login-btn:hover { opacity:0.85; }
    .login-btn:disabled { opacity:0.4; cursor:not-allowed; }
    .divider { display:flex; align-items:center; gap:12px; margin:20px 0; }
    .divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }
    .divider span { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; }
    .social-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .social-btn { display:flex; align-items:center; justify-content:center; gap:8px; padding:13px; border-radius:var(--radius); border:1px solid var(--border); background:var(--s2); font:500 13px var(--font); color:var(--text); cursor:pointer; transition:background 0.15s; }
    .social-btn:hover { background:var(--s3); }
    .signup-area { text-align:center; margin-top:24px; font-size:13px; color:var(--text2); }
    .signup-area a { color:var(--primary); text-decoration:none; font-weight:600; }
    .tab-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:390px; display:flex; justify-content:space-around; align-items:center; padding:8px 0 max(env(safe-area-inset-bottom,8px),8px); background:rgba(17,19,24,0.96); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-top:1px solid var(--border); }
    .tab-item { display:flex; flex-direction:column; align-items:center; gap:2px; text-decoration:none; color:var(--muted); font-size:10px; font-weight:500; padding:4px 12px; background:none; border:0; cursor:pointer; font-family:var(--font); transition:color 0.15s; }
    .tab-item .tab-icon { font-size:20px; line-height:1; }
    .tab-item.active { color:var(--primary); }
    .error-text { font-size:12px; color:#ff4757; margin-top:4px; display:none; }
    .error-text.show { display:block; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status-bar"><span>9:41</span><span>&#9679;&#9679;&#9679;</span></div>
    <a class="back-btn" href="index.html">&#8592;</a>
    <div class="content">
      <div class="brand-area">
        <div class="icon">P</div>
        <h2>Welcome back</h2>
        <p>Sign in to manage your home</p>
      </div>
      <form onsubmit="return false;">
        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="you@example.com" id="email" />
          <div class="error-text" id="emailError">Please enter a valid email</div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="Enter your password" id="password" />
          <div class="error-text" id="passError">Password is required</div>
        </div>
        <div class="form-options">
          <label><input type="checkbox" checked /> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>
        <button class="login-btn" id="loginBtn">Log in</button>
      </form>
      <div class="divider"><span>Or continue with</span></div>
      <div class="social-row">
        <button class="social-btn">&#9679; Google</button>
        <button class="social-btn">&#9679; Apple</button>
      </div>
      <div class="signup-area">Don't have an account? <a href="#">Sign up</a></div>
    </div>
    <nav class="tab-bar">
      <a class="tab-item" href="#"><span class="tab-icon">&#9650;</span>Home</a>
      <a class="tab-item" href="#"><span class="tab-icon">&#9825;</span>Wardrobe</a>
      <a class="tab-item" href="#"><span class="tab-icon">&#9733;</span>Fridge</a>
      <a class="tab-item" href="#"><span class="tab-icon">&#8981;</span>Search</a>
      <a class="tab-item active" href="#"><span class="tab-icon">&#9881;</span>Account</a>
    </nav>
  </div>
  <script>
    document.getElementById('loginBtn').addEventListener('click', function() {
      var e = document.getElementById('email'), p = document.getElementById('password');
      var ee = document.getElementById('emailError'), pe = document.getElementById('passError');
      var valid = true;
      if (!e.value || !e.value.includes('@')) { ee.classList.add('show'); e.style.borderColor='#ff4757'; valid=false; } else { ee.classList.remove('show'); e.style.borderColor=''; }
      if (!p.value) { pe.classList.add('show'); p.style.borderColor='#ff4757'; valid=false; } else { pe.classList.remove('show'); p.style.borderColor=''; }
      if (valid) { this.textContent='Logging in...'; this.disabled=true; var s=this; setTimeout(function(){ s.textContent='Logged in'; setTimeout(function(){ s.textContent='Log in'; s.disabled=false; },2000); },1200); }
    });
  </script>
</body>
</html>
